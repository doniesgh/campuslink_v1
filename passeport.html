    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Inter", Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            font-family: 'Inter', sans-serif;
            background: #FFFFFF;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .frame {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(226, 0, 13, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(226, 0, 13, 0.08) 0%, transparent 50%);
            animation: bgFloat 15s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes bgFloat {

            0%,
            100% {
                transform: scale(1) translate(0, 0);
            }

            50% {
                transform: scale(1.1) translate(20px, 20px);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            background: white;
            border-radius: 30px;
            padding: 60px 80px;
            max-width: 900px;
            width: 90%;

            text-align: center;
            margin-top: 200px;
            margin-left: 500px;
        }

        .status-container {
            margin-bottom: 50px;
        }

        .card-icon-wrapper {
            width: 180px;
            height: 180px;
            margin: 0 auto 40px;
            background: linear-gradient(135deg, #e2000d 0%, #b00009 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {

            0%,
            100% {
                transform: scale(1);

            }

            50% {
                transform: scale(1.05);

            }
        }

        .card-icon {
            font-size: 100px;
            color: white;
            animation: cardRotate 3s ease-in-out infinite;
        }

        @keyframes cardRotate {

            0%,
            100% {
                transform: rotateY(0deg);
            }

            50% {
                transform: rotateY(180deg);
            }
        }

        .status-text {
            font-size: 36px;
            font-weight: 700;
            color: #000;
            margin-bottom: 20px;
            animation: fadeInUp 0.8s ease-out;
        }

        .status-subtext {
            font-size: 24px;
            font-weight: 500;
            color: #666;
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

                opacity: 1;
                transform: translateY(0);
            }

        .progress-container {

            height: 8px;

            overflow: hidden;
            margin: 40px 0;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .progress-bar {

            background: linear-gradient(90deg, #e2000d 0%, #ff3333 100%);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .card-slot {
            width: 100%;
            max-width: 400px;
            height: 250px;
            margin: 40px auto;
            background: linear-gradient(135deg, #2c2c2c 0%, #1a1a1a 100%);
            border-radius: 20px;
            position: relative;
            overflow: hidden;

            display: none;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .card-slot.active {
            display: block;
        }

        .card-slot::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #e2000d, transparent);
            animation: slotLight 2s ease-in-out infinite;
        }

        @keyframes slotLight {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        .card-in-slot {
            width: 85%;
            height: 160px;
            background: linear-gradient(135deg, #e2000d 0%, #b00009 100%);
            border-radius: 15px;
            position: absolute;
            bottom: -200px;
            left: 50%;
            transform: translateX(-50%);

            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: 700;
        }

        .card-in-slot.ejected {
            animation: cardEject 2s ease-out forwards;
        }

        @keyframes cardEject {
            0% {
                bottom: -200px;
            }

            100% {
                bottom: 45px;
            }

        .card-in-slot::before {
            content: "💳";

            top: 50%;
            left: 50%;

            position: relative;
            overflow: hidden;

        .take-card-btn.active {

        @keyframes buttonAppear {

                transform: scale(0.8);
            }

            }

        .take-card-btn::before {

            left: 50%;

            height: 0;

            margin-bottom: 20px;
            animation: checkmarkPop 0.6s ease-out;
        }

        @keyframes checkmarkPop {
            0% {

                opacity: 0;
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }

        .completion-text {

            font-weight: 700;
            color: #000;
            margin-bottom: 15px;
        }

        .completion-subtext {
            font-size: 20px;
            color: #666;

        .loading-dots {

    <script>
        // UI Elements
        const statusText = document.getElementById('statusText');
        const statusSubtext = document.getElementById('statusSubtext');
        const progressBar = document.getElementById('progressBar');
        const cardSlot = document.getElementById('cardSlot');
        const cardInSlot = document.getElementById('cardInSlot');
        const takeCardBtn = document.getElementById('takeCardBtn');
        const statusContainer = document.getElementById('statusContainer');
        const completionMessage = document.getElementById('completionMessage');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        // Popup de lecture carte
        const cardDataOverlay = document.getElementById('cardDataOverlay');
        const cardDataFields = document.getElementById('cardDataFields');
        const cardDataContinueBtn = document.getElementById('cardDataContinueBtn');

        // ECAT SDK
        let ecatSDK = null;

        // Card print configuration
        const cardPrintConfig = {
            X: "100",              // X position
            Y: "50",               // Y position
            FontName: "Arial",     // Font name
            FontType: "1",      // Font type
            FontSize: "24",        // Font size
            Resolution: "300",     // Resolution
            Data: "TUNISYS TEST PRINT" // Text to print
        };

        // Progress tracking
        let currentProgress = 0;

        function updateProgress(percent, status, substatus) {
            currentProgress = percent;
            progressBar.style.width = percent + '%';

            if (status) {
                statusText.textContent = status;
            }

            if (substatus) {
                statusSubtext.innerHTML = substatus;
            }
        }

        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.add('active');

            setTimeout(() => {
                errorMessage.classList.remove('active');
            }, 5000);
        }

        function initializeSDK() {
            return new Promise((resolve, reject) => {
                updateProgress(10, 'Please wait', 'Your card is being prepared...');

                try {
                    ecatSDK = (new ECatSdk).createNew();

                    ecatSDK.open(function (status) {
                        if (status) {
                            console.log("SDK opened successfully");

                            // Subscribe to card dispenser events
                            var cardReaderEventHandler = function (evt) {
                                console.log("Card dispenser event: " + JSON.stringify(evt));
                            };
                            ecatSDK.deviceManager.cardDispenser.devEvent.subscribe(cardReaderEventHandler);

                            // Subscribe to card reader (crdidc) events - lecture des pistes/données de carte
                            ecatSDK.deviceManager.crdidc.devEvent.subscribe(crdidcEventHandler);

                            updateProgress(20, 'Please wait', 'Your card is being prepared...');
                            resolve(true);
                        } else {
                            reject(new Error("Failed to open SDK"));
                        }
                    });
                } catch (error) {
                    reject(error);
                }
            });
        }

        let currentReadResolver = null;
        let currentReadRejecter = null;

        function crdidcEventHandler(evt) {
            console.log("Card reader (crdidc) event - FULL:", evt);

            if (evt.eventName === "OnReadRawDataCompleted") {
                lastRawDataEvent = { data: evt.data, timestamp: Date.now() };
                if (currentReadResolver) {
                    const resolve = currentReadResolver;
                    currentReadResolver = null;
                    currentReadRejecter = null;
                    resolve(evt.data);
                }
            } else if (evt.eventName === "OnReadRawDataError") {
                if (currentReadRejecter) {
                    const reject = currentReadRejecter;
                    currentReadResolver = null;
                    currentReadRejecter = null;
                    reject(new Error("Erreur de lecture des données de la carte"));
                }
            }
        }
        // Démarre une lecture de carte (piste magnétique) et retourne une Promise
        // qui se résout avec les données lues (m_track1, m_track2, m_track3, m_sta, m_type)
        function readCardData(timeoutMs = 8000) {
            return new Promise((resolve, reject) => {
                let settled = false;
                if (lastRawDataEvent && Date.now() - lastRawDataEvent.timestamp < 5000) {
                    const data = lastRawDataEvent.data;
                    lastRawDataEvent = null;
                    resolve(data);
                    return;
                }
                currentReadResolver = (data) => {
                    if (settled) return;
                    settled = true;
                    resolve(data);
                };
                currentReadRejecter = (err) => {
                    if (settled) return;
                    settled = true;
                    reject(err);
                };

                ecatSDK.deviceManager.crdidc.devReadRawDataAsyn(function (result) {
                    if (!result.success) {
                        if (settled) return;
                        settled = true;
                        currentReadResolver = null;
                        currentReadRejecter = null;
                        reject(new Error("Impossible de démarrer la lecture de la carte"));
                    }
                });

                // Sécurité: si aucun événement ne revient, on n'attend pas indéfiniment
                setTimeout(() => {
                    if (settled) return;
                    settled = true;
                    currentReadResolver = null;
                    currentReadRejecter = null;
                    reject(new Error("Délai de lecture de la carte dépassé"));
                }, timeoutMs);
            });
        }

        // Affiche la popup avec les données lues et attend que l'utilisateur clique sur "Continuer"
        function showCardDataPopup(data) {
            return new Promise((resolve) => {
                cardDataFields.innerHTML = "";

                const fieldsToShow = [
                    { label: "Track 1", value: data && data.m_track1 },
                    { label: "Track 2", value: data && data.m_track2 },
                    { label: "Track 3", value: data && data.m_track3 },
                    { label: "Statut", value: data && data.m_sta },
                    { label: "Type", value: data && data.m_type }
                ];

                fieldsToShow.forEach(f => {
                    const div = document.createElement('div');
                    div.className = 'card-data-field';
                    div.innerHTML = `<div class="label">${f.label}</div><div class="value">${f.value !== undefined && f.value !== null && f.value !== "" ? f.value : "-"}</div>`;
                    cardDataFields.appendChild(div);
                });

                cardDataOverlay.classList.add('active');

                const onContinue = () => {
                    cardDataOverlay.classList.remove('active');
                    cardDataContinueBtn.removeEventListener('click', onContinue);
                    resolve();
                };
                cardDataContinueBtn.addEventListener('click', onContinue);
            });
        }

        function resetCardDispenser() {
            return new Promise((resolve, reject) => {
                updateProgress(30, 'Please wait', 'Your card is being prepared...');

                ecatSDK.deviceManager.cardDispenser.devReset(ValuesDef.CardReaderResetMode.NoAction, function (result) {
                    if (result.success) {
                        console.log("Card dispenser reset successfully");
                        updateProgress(40, 'Please wait', 'Your card is being prepared...');
                        resolve(true);
                    } else {
                        reject(new Error("Failed to reset card dispenser"));
                    }
                });
            });
        }

        function printSingleText(text, x, y, fontsize, fonttype) {
            return new Promise((resolve, reject) => {
                ValuesDef.CardDispenserPrintText.X = x;
                ValuesDef.CardDispenserPrintText.Y = y;
                ValuesDef.CardDispenserPrintText.FontName = "Consolas";
                ValuesDef.CardDispenserPrintText.FontType = fonttype;
                ValuesDef.CardDispenserPrintText.FontSize = fontsize;
                ValuesDef.CardDispenserPrintText.Resolution = "16";
                ValuesDef.CardDispenserPrintText.Data = text;

                ecatSDK.deviceManager.cardDispenser.devPrintCardText(
                    ValuesDef.CardDispenserPrintText,
                    function (result) {
                        if (result.success) {
                            console.log(`Printed: ${text} at X:${x} Y:${y}`);
                            resolve(true);
                        } else {
                            reject(new Error(`Failed to print: ${text}`));
                        }
                    }
                );
            });
        }

        function dispenseCard() {
            return new Promise((resolve, reject) => {
                updateProgress(30, 'Please wait', 'Your card is being prepared...');

                ecatSDK.deviceManager.cardDispenser.devUpdateStatus(function (statusResult) {
                    console.log("devUpdateStatus result:", JSON.stringify(statusResult));

                    ecatSDK.deviceManager.cardDispenser.devGetInfo(function (infoResult) {
                        console.log("devGetInfo result:", JSON.stringify(infoResult));

                        ecatSDK.deviceManager.cardDispenser.devDispenseCard(
                            ValuesDef.CardDispenserSupplyBin.Second,
                            ValuesDef.CardDispenserDispenseType.CONSUMER,
                            function (result) {
                                // Log complet du résultat brut renvoyé par le hardware
                                console.log("devDispenseCard raw result:", JSON.stringify(result));
                                console.log("devDispenseCard FULL raw result:", result); // ← AJOUT ICI

                                if (result.success) {
                                    console.log("Card dispensed successfully");
                                    updateProgress(40, 'Please wait', 'Your card is being prepared...');
                                    resolve(true);
                                } else {
                                    const errCode = result.errorCode || result.code || result.data || "inconnu";
                                    reject(new Error("Failed to dispense card (code: " + errCode + ")"));
                                }
                            }
                        );
                    });
                });
            });
        }

            return new Promise((resolve, reject) => {

                        setTimeout(() => {

                        }, 2000);

                        resolve(true);
                    } else {
                        reject(new Error("Failed to eject card"));
                    }
                });
            });

        async function automateCardDispensing() {
            try {
                await initializeSDK();
                await resetCardDispenser();

                // Move the card into position
                updateProgress(55, 'Please wait', 'Dispensing card...');
                await dispenseCard();

                // Always print
                updateProgress(70, 'Please wait', 'Printing card...');
                await printTextOnCard();

                // Eject so the user can take it
                await ejectCard();

            } catch (error) {
                console.error("Error in automation:", error);
                showError("Erreur: " + error.message);
                statusText.textContent = "Erreur de distribution";
                statusSubtext.innerHTML = "Veuillez contacter le service client";
            }
        }

        function waitForDeviceOnline(timeoutMs = 15000) {
            return new Promise((resolve, reject) => {
                let settled = false;

                const onlineWatcher = function (evt) {
                    if (evt.eventName === "OnChangeDevState" && evt.data && evt.data.DeviceStatus === "ONLINE") {
                        if (settled) return;
                        settled = true;
                        ecatSDK.deviceManager.crdidc.devEvent.unsubscribe(onlineWatcher);
                        resolve(true);
                    }
                };

                ecatSDK.deviceManager.crdidc.devEvent.subscribe(onlineWatcher);

                setTimeout(() => {
                    if (settled) return;
                    settled = true;
                    ecatSDK.deviceManager.crdidc.devEvent.unsubscribe(onlineWatcher);
                    reject(new Error("Timeout: le lecteur de carte n'est jamais passé ONLINE"));
                }, timeoutMs);
            });
        }
